name = "lean-exactness"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanExactness"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "LeanExactness"
